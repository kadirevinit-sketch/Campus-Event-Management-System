<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header(${isEdit} ? 'Edit Event' : 'Create Campus Event')}"></head>
<body>

    <!-- Navbar -->
    <div th:replace="~{fragments/layout :: navbar('admin-dashboard')}"></div>

    <!-- Alert Messages -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="main-content">
        <div class="container">
            <div style="margin-bottom: 1.5rem;">
                <a th:href="@{/admin/dashboard}" class="btn btn-sm btn-secondary">
                    &larr; Back to Dashboard
                </a>
            </div>

            <div class="form-card" style="max-width: 820px;">
                <div class="form-header">
                    <span class="brand-badge" style="width: 50px; height: 50px; font-size: 1.5rem; margin: 0 auto 1rem;">
                        <span th:text="${isEdit} ? '✏️' : '✨'">✨</span>
                    </span>
                    <h2 th:text="${isEdit} ? 'Edit Campus Event' : 'Create New Campus Event'">Create Event</h2>
                    <p style="color: var(--text-muted); font-size: 0.95rem;">Fill out the event schedule, location, capacity, and registration deadlines</p>
                </div>

                <form id="eventForm"
                      th:action="${isEdit} ? @{/admin/events/{id}/edit(id=${eventId})} : @{/admin/events/new}"
                      th:object="${eventDto}" method="post">

                    <!-- Title -->
                    <div class="form-group">
                        <label for="title">Event Title <span style="color: var(--accent-rose);">*</span></label>
                        <input type="text" id="title" th:field="*{title}"
                               class="input-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''"
                               placeholder="e.g. Annual Autonomous Robotics Hackathon 2026" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                    </div>

                    <!-- Description -->
                    <div class="form-group">
                        <label for="description">Event Description <span style="color: var(--accent-rose);">*</span></label>
                        <textarea id="description" th:field="*{description}" rows="4"
                                  class="input-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"
                                  placeholder="Provide comprehensive details about agenda, eligibility, prizes, and prerequisites..." required></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                    </div>

                    <div class="form-row">
                        <!-- Category -->
                        <div class="form-group">
                            <label for="category">Category <span style="color: var(--accent-rose);">*</span></label>
                            <select id="category" th:field="*{category}"
                                    class="input-control" th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''" required>
                                <option value="">-- Choose Category --</option>
                                <option value="Technical">Technical</option>
                                <option value="Hackathon">Hackathon</option>
                                <option value="Workshop">Workshop</option>
                                <option value="Seminar">Seminar</option>
                                <option value="Cultural">Cultural</option>
                                <option value="Sports">Sports</option>
                                <option value="Other">Other</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                        </div>

                        <!-- Organizer -->
                        <div class="form-group">
                            <label for="organizer">Host / Club / Department <span style="color: var(--accent-rose);">*</span></label>
                            <input type="text" id="organizer" th:field="*{organizer}"
                                   class="input-control" th:classappend="${#fields.hasErrors('organizer')} ? 'is-invalid' : ''"
                                   placeholder="e.g. Google Student Developer Club &amp; Dept of CSE" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('organizer')}" th:errors="*{organizer}"></div>
                        </div>
                    </div>

                    <div class="form-row">
                        <!-- Event Date -->
                        <div class="form-group">
                            <label for="eventDate">Event Date <span style="color: var(--accent-rose);">*</span></label>
                            <input type="date" id="eventDate" th:field="*{eventDate}"
                                   class="input-control" th:classappend="${#fields.hasErrors('eventDate')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('eventDate')}" th:errors="*{eventDate}"></div>
                        </div>

                        <!-- Registration Deadline -->
                        <div class="form-group">
                            <label for="registrationDeadline">Registration Deadline <span style="color: var(--accent-rose);">*</span></label>
                            <input type="date" id="registrationDeadline" th:field="*{registrationDeadline}"
                                   class="input-control" th:classappend="${#fields.hasErrors('registrationDeadline')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('registrationDeadline')}" th:errors="*{registrationDeadline}"></div>
                            <small style="color: var(--text-dim); font-size: 0.78rem;">Must be on or before the event date.</small>
                        </div>
                    </div>

                    <div class="form-row">
                        <!-- Start Time -->
                        <div class="form-group">
                            <label for="startTime">Start Time <span style="color: var(--accent-rose);">*</span></label>
                            <input type="time" id="startTime" th:field="*{startTime}"
                                   class="input-control" th:classappend="${#fields.hasErrors('startTime')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}"></div>
                        </div>

                        <!-- End Time -->
                        <div class="form-group">
                            <label for="endTime">End Time <span style="color: var(--accent-rose);">*</span></label>
                            <input type="time" id="endTime" th:field="*{endTime}"
                                   class="input-control" th:classappend="${#fields.hasErrors('endTime')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('endTime')}" th:errors="*{endTime}"></div>
                        </div>
                    </div>

                    <div class="form-row">
                        <!-- Venue -->
                        <div class="form-group">
                            <label for="venue">Campus Venue Location <span style="color: var(--accent-rose);">*</span></label>
                            <input type="text" id="venue" th:field="*{venue}"
                                   class="input-control" th:classappend="${#fields.hasErrors('venue')} ? 'is-invalid' : ''"
                                   placeholder="e.g. Technology Block, Lab 304 or Amphitheatre" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('venue')}" th:errors="*{venue}"></div>
                        </div>

                        <!-- Capacity -->
                        <div class="form-group">
                            <label for="capacity">Seat Capacity <span style="color: var(--accent-rose);">*</span></label>
                            <input type="number" id="capacity" th:field="*{capacity}" min="1" max="10000"
                                   class="input-control" th:classappend="${#fields.hasErrors('capacity')} ? 'is-invalid' : ''"
                                   placeholder="e.g. 100" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></div>
                        </div>
                    </div>

                    <div class="form-row">
                        <!-- Status -->
                        <div class="form-group">
                            <label for="status">Publication Status</label>
                            <select id="status" th:field="*{status}" class="input-control">
                                <option value="PUBLISHED">Published (Open for Registration)</option>
                                <option value="DRAFT">Draft (Hidden from Students)</option>
                                <option value="CANCELLED">Cancelled</option>
                                <option value="COMPLETED">Completed</option>
                            </select>
                        </div>

                        <!-- Poster URL -->
                        <div class="form-group">
                            <label for="posterUrl">Event Poster / Banner Image URL</label>
                            <input type="url" id="posterUrl" th:field="*{posterUrl}"
                                   class="input-control" placeholder="https://example.com/poster.jpg">
                            <small style="color: var(--text-dim); font-size: 0.78rem;">Optional. Provide a direct HTTPS link to an image.</small>
                        </div>
                    </div>

                    <div style="display: flex; gap: 1rem; margin-top: 2rem; justify-content: flex-end;">
                        <a th:href="@{/admin/dashboard}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary" th:text="${isEdit} ? 'Save Changes' : 'Publish Campus Event'">
                            Publish Event
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
