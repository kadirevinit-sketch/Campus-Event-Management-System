<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Sign In')}"></head>
<body>

    <!-- Navbar -->
    <div th:replace="~{fragments/layout :: navbar('login')}"></div>

    <!-- Alert Messages -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="main-content">
        <div class="container">
            <div class="form-card">
                <div class="form-header">
                    <span class="brand-badge" style="width: 50px; height: 50px; font-size: 1.5rem; margin: 0 auto 1rem;">🔐</span>
                    <h2>Campus Sign In</h2>
                    <p style="color: var(--text-muted); font-size: 0.95rem;">Enter your university credentials to access events and registrations</p>
                </div>

                <!-- URL Error/Logout alerts -->
                <div th:if="${param.error}" class="alert alert-danger">
                    <span>⚠️</span>
                    <span>Invalid email or password. Please verify and try again.</span>
                </div>
                <div th:if="${param.logout}" class="alert alert-info">
                    <span>👋</span>
                    <span>You have been signed out successfully.</span>
                </div>

                <!-- Demo Fast-Fill Box -->
                <div style="background: rgba(99, 102, 241, 0.08); border: 1px dashed rgba(99, 102, 241, 0.3); border-radius: var(--radius-md); padding: 1rem; margin-bottom: 1.5rem; text-align: center;">
                    <div style="font-size: 0.8rem; font-weight: 700; color: var(--primary-light); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">
                        ⚡ Quick Demo Fill
                    </div>
                    <div style="display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap;">
                        <button type="button" id="fillDemoAdmin" class="btn btn-sm btn-outline">
                            🛡️ Fill Admin (admin@campus.edu)
                        </button>
                        <button type="button" id="fillDemoStudent" class="btn btn-sm btn-outline">
                            🎓 Fill Student (student@campus.edu)
                        </button>
                    </div>
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="form-group">
                        <label for="email">Campus Email Address</label>
                        <input type="email" id="email" name="email" class="input-control"
                               placeholder="e.g. yourname@campus.edu" required autofocus>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" class="input-control"
                               placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; margin-top: 0.75rem;">
                        Sign In to Campus Portal &rarr;
                    </button>
                </form>

                <div style="margin-top: 1.75rem; text-align: center; border-top: 1px solid var(--border-subtle); padding-top: 1.25rem;">
                    <p style="color: var(--text-muted); font-size: 0.9rem;">
                        New college student?
                        <a th:href="@{/register}" style="color: var(--primary-light); font-weight: 600;">Create an account here</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
