spring.application.name=Campus Event Management System

# Server Configuration
server.port=8080

# SQLite Datasource Configuration
spring.datasource.url=jdbc:sqlite:./campus_events.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate Configuration for SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Application Admin Initialization Settings
app.admin.email=admin@campus.edu
app.admin.password=Admin@123
app.admin.name=Campus Administrator
app.admin.department=Administration
